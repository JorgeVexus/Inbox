name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Calidad (tipos, lint, pruebas, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:cobertura
      - run: npm run qa:muerto
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          SITE_URL: https://ejemplo.invalid

  e2e:
    name: E2E (Chrome)
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run build
      - run: npx playwright test --project=chrome --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  rendimiento:
    name: Rendimiento (Lighthouse móvil con presupuestos)
    runs-on: ubuntu-latest
    needs: calidad
    # Se deja sin bloquear las primeras semanas: los ejecutores compartidos de GitHub tienen más ruido
    # que una computadora local. Cuando varias corridas seguidas salgan estables, quitar esta línea.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run build
      - name: Servir el sitio y medir
        env:
          LH_URL: http://localhost:3500
          LH_SALIDA: lighthouse.json
        run: |
          npx next start -p 3500 &
          until curl -sf http://localhost:3500/ > /dev/null; do sleep 1; done
          npm run qa:lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: lighthouse.json
          retention-days: 14
